name: 构建双麦听诊安卓APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 获取项目源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 35 编译组件
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle 8.9（无需电脑安装）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: 运行 MC 协议解析单元测试
        run: |
          mkdir -p /tmp/ac7916-test
          javac -encoding UTF-8 -d /tmp/ac7916-test app/src/main/java/com/ac7916/stethoscope/MicPacket.java test/MicPacketTest.java
          java -cp /tmp/ac7916-test MicPacketTest

      - name: 编译可安装的调试版 APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: 验证 APK 输出
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 提供 APK 下载
        uses: actions/upload-artifact@v4
        with:
          name: AC7916_双麦听诊_安卓APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
